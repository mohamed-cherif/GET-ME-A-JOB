# Two modes in one workflow:
#
#   scheduled (default)  - runs ONE polling cycle twice a day (see cron below). Cheap: a few Actions
#                          minutes per day, fine for a private repo's free tier. Postings are found
#                          within hours of going live.
#   continuous           - "Run workflow" with continuous = true: loops for ~5.5 h, saves state, then
#                          dispatches itself again, forever (GitHub's per-job limit is 6 h). Real-time,
#                          but ~44,000 Actions minutes a month: only for a public repo or a paid plan.
#                          To stop it: cancel the running job in the Actions tab.
#
# Secrets (Settings -> Secrets and variables -> Actions): TELEGRAM_BOT_TOKEN (or another channel), and one
# LLM key for the judge: GEMINI_API_KEY / GROQ_API_KEY (free) / ANTHROPIC_API_KEY ...
# The seen-postings memory lives in the Actions cache and survives between runs.
name: hardware-internships-watch

on:
  schedule:
    # cron is UTC. 13:00 UTC = 9:00 New York (EDT); 22:00 UTC = 18:00 New York.
    # GitHub may delay scheduled runs by some minutes; that is fine at this cadence.
    - cron: "0 13 * * *"
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      continuous:
        description: "Run 24/7 (loop ~5.5h and re-dispatch) instead of a single cycle"
        type: boolean
        default: false
      dry_run:
        description: "Classify only, do not notify"
        type: boolean
        default: false

concurrency:
  group: hardware-internships-watch
  cancel-in-progress: false     # a scheduled run just waits if a continuous run is active

permissions:
  contents: read
  actions: write                # save the cache + (continuous mode) dispatch the next run

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Restore seen-jobs database
        uses: actions/cache/restore@v4
        with:
          path: state
          key: hwintern-state-${{ github.run_id }}
          restore-keys: |
            hwintern-state-

      - name: Check that a notification channel is configured
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          GENERIC_WEBHOOK_URL: ${{ secrets.GENERIC_WEBHOOK_URL }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN$DISCORD_WEBHOOK_URL$NTFY_TOPIC$SLACK_WEBHOOK_URL$NOTIFY_EMAIL$GENERIC_WEBHOOK_URL" ]; then
            echo "::error::No notification secret is set (e.g. TELEGRAM_BOT_TOKEN). Add one under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Start a local Ollama model (only when the OLLAMA_MODEL variable is set)
        if: vars.OLLAMA_MODEL != ''
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > /tmp/ollama.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://localhost:11434/api/tags >/dev/null && break; sleep 1; done
          ollama pull "${{ vars.OLLAMA_MODEL }}"

      - name: Watch
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_MODEL: ${{ vars.LLM_MODEL || vars.OLLAMA_MODEL }}
          OLLAMA_HOST: ${{ vars.OLLAMA_MODEL != '' && 'http://localhost:11434' || '' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MENTION: ${{ vars.DISCORD_MENTION }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          GENERIC_WEBHOOK_URL: ${{ secrets.GENERIC_WEBHOOK_URL }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m hwintern run --dry-run
          elif [ "${{ inputs.continuous }}" = "true" ]; then
            python -m hwintern run --loop --max-minutes 335
          else
            python -m hwintern run
          fi

      - name: Save seen-jobs database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: hwintern-state-${{ github.run_id }}

      - name: Upload log of matched postings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: new-jobs-log-${{ github.run_id }}
          path: |
            state/NEW_JOBS.md
            state/new_jobs.jsonl
          if-no-files-found: ignore
          retention-days: 30

      - name: Start the next continuous run
        if: success() && inputs.continuous == true && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run hardware-internships.yml --ref main -f continuous=true
