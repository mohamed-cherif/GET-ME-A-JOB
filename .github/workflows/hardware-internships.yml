# Runs the watcher continuously on GitHub's servers.
#
# GitHub's cron scheduler is unreliable for short intervals (it frequently skips */5 runs), so instead
# each job runs the watcher in a loop for ~5.5 hours (GitHub's per-job limit is 6h), saves its memory
# of seen postings to the Actions cache, and then dispatches the next run of itself. An hourly cron
# only acts as a watchdog that restarts the chain if a run ever dies.
#
# Secrets (Settings -> Secrets and variables -> Actions): TELEGRAM_BOT_TOKEN (or another channel),
# ANTHROPIC_API_KEY for the LLM judge.
name: hardware-internships-watch

on:
  schedule:
    - cron: "7 * * * *"          # watchdog: restart the chain if nothing is running
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Classify only, do not notify, exit after one cycle"
        type: boolean
        default: false

concurrency:
  group: hardware-internships-watch
  cancel-in-progress: false     # a queued run simply waits for the running one to finish

permissions:
  contents: read
  actions: write                # save the cache + dispatch the next run

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Restore seen-jobs database
        uses: actions/cache/restore@v4
        with:
          path: state
          key: hwintern-state-${{ github.run_id }}
          restore-keys: |
            hwintern-state-

      - name: Check that a notification channel is configured
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          GENERIC_WEBHOOK_URL: ${{ secrets.GENERIC_WEBHOOK_URL }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN$DISCORD_WEBHOOK_URL$NTFY_TOPIC$SLACK_WEBHOOK_URL$NOTIFY_EMAIL$GENERIC_WEBHOOK_URL" ]; then
            echo "::error::No notification secret is set (e.g. TELEGRAM_BOT_TOKEN). Add one under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Watch (continuous loop, ~5.5h)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MENTION: ${{ vars.DISCORD_MENTION }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          GENERIC_WEBHOOK_URL: ${{ secrets.GENERIC_WEBHOOK_URL }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m hwintern run --dry-run
          else
            python -m hwintern run --loop --max-minutes 335
          fi

      - name: Save seen-jobs database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: hwintern-state-${{ github.run_id }}

      - name: Upload log of matched postings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: new-jobs-log-${{ github.run_id }}
          path: |
            state/NEW_JOBS.md
            state/new_jobs.jsonl
          if-no-files-found: ignore
          retention-days: 30

      - name: Start the next run
        if: success() && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run hardware-internships.yml --ref main
