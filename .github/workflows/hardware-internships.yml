# Zero-infrastructure option: GitHub Actions polls every board on a schedule and keeps the
# "already seen" database in the Actions cache between runs.
#
# Setup: Settings -> Secrets and variables -> Actions -> add DISCORD_WEBHOOK_URL / TELEGRAM_* /
# NTFY_TOPIC ... (any channel you configured in config.yaml). Then enable the workflow.
#
# Note: GitHub runs cron jobs "at least" every 5 minutes and often delays them by several minutes
# when runners are busy. For true real-time polling run `docker compose up -d` on any always-on box.
name: hardware-internships-watch

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Classify only, do not notify"
        type: boolean
        default: false

concurrency:
  group: hardware-internships-watch
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # needed to save the state cache

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Restore seen-jobs database
        uses: actions/cache/restore@v4
        with:
          path: state
          key: hwintern-state-${{ github.run_id }}
          restore-keys: |
            hwintern-state-

      - name: Check that a notification channel is configured
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          GENERIC_WEBHOOK_URL: ${{ secrets.GENERIC_WEBHOOK_URL }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN$DISCORD_WEBHOOK_URL$NTFY_TOPIC$SLACK_WEBHOOK_URL$NOTIFY_EMAIL$GENERIC_WEBHOOK_URL" ]; then
            echo "::error::No notification secret is set (e.g. TELEGRAM_BOT_TOKEN). Add one under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Poll boards
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MENTION: ${{ vars.DISCORD_MENTION }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          GENERIC_WEBHOOK_URL: ${{ secrets.GENERIC_WEBHOOK_URL }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m hwintern run --dry-run
          else
            python -m hwintern run
          fi

      - name: Save seen-jobs database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: hwintern-state-${{ github.run_id }}

      - name: Upload log of matched postings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: new-jobs-log
          path: |
            state/NEW_JOBS.md
            state/new_jobs.jsonl
          if-no-files-found: ignore
          retention-days: 30
