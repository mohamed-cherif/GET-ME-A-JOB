# ---------------------------------------------------------------------------
# hardware-internships watcher configuration
# Values like ${DISCORD_WEBHOOK_URL} are read from environment variables
# (or a .env file if you use docker compose). ${VAR:-default} syntax works too.
# ---------------------------------------------------------------------------

run:
  interval_minutes: 10          # how often to poll every board when running with --loop
  jitter_seconds: 20
  workers: 12                  # parallel HTTP workers
  request_timeout: 30
  detail_fetch_limit: 150      # per cycle: extra per-posting requests (Workday/SmartRecruiters/Oracle descriptions)
  initial_max_age_days: 45     # first run only: don't notify about postings older than this (null = notify everything)
  auto_discover: true          # add boards discovered through the community feeds automatically
  # Tiers: 🎯 target (fit score >= 75) and ✅ match (>= 55) are pushed the moment they appear.
  # 🟡 safety postings are collected and sent once a day as a single digest (Telegram: silent).
  digest_tiers: [safety]
  digest_time: "13:00"         # UTC -> 9:00 New York / 15:00 Paris
  digest_max_queue: 40         # send the digest early if this many pile up
  log_level: INFO
  state_dir: state             # sqlite db + NEW_JOBS.md live here

filters:
  # Summer 2027 is the primary target. Other seasons are kept too (flagged "other-term" and listed
  # after the Summer matches); the seasons below are already over and are dropped.
  target_terms: ["Summer 2027"]
  also_accept_terms: []
  accept_other_terms: true
  reject_terms: ["Spring 2026", "Summer 2026", "Winter 2026", "Fall 2026", "Fall 2027"]
  reject_years: [2023, 2024, 2025]
  accept_unknown_term: true

  # Hardware taxonomy groups (see hwintern/filters.py for the keyword lists). Remove any you don't want.
  categories: [electrical, hardware, embedded, silicon, analog_rf, robotics_controls, mechanical, test_validation]
  extra_keywords: ["\\bcomputer vision\\b", "\\bperception\\b", "\\bedge (?:ai|ml)\\b", "\\btinyml\\b", "\\bwearable\\b"]
  match_description: true
  min_description_hits: 2
  require_internship: true

  # Titles hitting these get a ⭐, are sent first, and use "urgent" priority on ntfy.
  priority_keywords: ["robot", "mechatronic", "avionic", "drone", "\\bUAV\\b", "\\bUAS\\b", "eVTOL", "aircraft",
                      "flight", "maritime", "naval", "\\bships?\\b", "marine", "underwater", "subsea", "\\b[AU]UV\\b",
                      "\\bUSV\\b", "\\bROV\\b", "autonom", "\\bGN&?C\\b", "satellite", "spacecraft", "rocket",
                      "exoskeleton", "humanoid", "manipulat", "embedded", "firmware", "control", "perception",
                      "computer vision", "\\bPCB\\b", "electrical"]

  # Countries. A posting whose location resolves to a country outside this list is dropped. Locations
  # that cannot be resolved ("Remote", "Multiple locations") are kept and flagged "location-unknown".
  countries_allow: [US, CA, GB, IT, FR, CH, DE, ES]
  drop_unknown_location: false
  preferred_countries: [US]    # small fit-score bonus (CPT makes US internships the simplest)
  # Extra regex filters on the raw location string, if you ever need them.
  location_include: []
  location_exclude: []
  # Fit-score tier thresholds (0-100)
  tier_target_min: 75
  tier_match_min: 55
  exclude_companies: ["\\bUniversity\\b", "\\bCollege\\b"]   # regexes on the company name

  # Eligibility. No citizenship / green card -> drop anything that requires them (or a clearance / ITAR
  # "US person"). "no-sponsorship" postings are KEPT and flagged: an internship on CPT does not need
  # sponsorship. PhD-titled roles are dropped; "graduate students only" wording is flagged.
  exclude_sponsorship: ["U.S. Citizenship is Required"]
  exclude_flags: ["citizenship-required", "phd-title"]

# LLM judge: after the keyword pre-filter, Claude reads each accepted posting (title + full description)
# and decides whether it genuinely fits the profile below. Its verdict can reject junk and its fit
# score drives the tier. Needs ANTHROPIC_API_KEY (in .env or as a GitHub Actions secret); without a
# key the watcher falls back to keyword tiers. Judgments are cached, so each posting is paid for once.
llm:
  enabled: true
  # Provider is picked automatically from whichever key exists in .env / secrets, in this order:
  # ANTHROPIC_API_KEY, GROQ_API_KEY (free tier), GEMINI_API_KEY (free tier), CEREBRAS_API_KEY (free tier),
  # OPENROUTER_API_KEY (":free" models), MISTRAL_API_KEY (free tier), or a local Ollama server.
  # Force one with LLM_PROVIDER; override the model with LLM_MODEL (see README "Free LLM options").
  provider: ${LLM_PROVIDER:-auto}
  model: ${LLM_MODEL:-}
  base_url: ${LLM_BASE_URL:-}     # only for provider: openai_compatible (vLLM, LM Studio, ...)
  api_key: ${LLM_API_KEY:-}
  effort: low                      # Anthropic only
  concurrency: 2                   # parallel judge calls; free tiers throttle, keep this small
  max_calls_per_cycle: 120
  min_relevance: 40            # hardware_relevance (0-100) below this -> rejected
  keyword_weight: 0.25         # final score = 75% LLM fit + 25% keyword score
  profile: |
    Undergraduate in Electrical & Computer Engineering + Computer Science at Duke (bachelor's, graduating
    May 2029; rising junior in Summer 2027), certificate in Robotics & Automation. Hands-on with embedded
    systems (ESP32, Arduino, Raspberry Pi, C/C++), PCB design (KiCad), sensor integration, forward/inverse
    kinematics and robotic-arm control, computer vision (YOLO, PyTorch), CAD and fabrication (SolidWorks,
    3D printing, CNC), exoskeleton research, an autonomous UUV, a phone-controlled robot platform.
    Wants: hardware / ECE internships, especially robotics, avionics, drones, ships/maritime systems,
    embedded/firmware, electrical/PCB, controls, perception. Mechanical or manufacturing hardware roles are ok.
    Not interested in pure software, web, data, ML-platform, IT or business roles.
    Constraints: international student on F-1 (CPT covers internships; needs sponsorship for full-time later);
    cannot take roles requiring US citizenship, a green card or a security clearance; undergraduate (no
    PhD/Master's-only roles); locations US, Canada, UK, Italy, France, Switzerland, Germany, Spain;
    Summer 2027 preferred, other terms acceptable.

# Where notifications go. Every enabled channel receives every new posting.
notifiers:
  - type: stdout
  - type: file                 # appends to state/NEW_JOBS.md and state/new_jobs.jsonl
    path: state
  - type: telegram             # primary channel. Open your bot, press Start; chat id is auto-detected.
    enabled: true
    bot_token: ${TELEGRAM_BOT_TOKEN}
    chat_id: ${TELEGRAM_CHAT_ID:-}
    silent_tiers: [safety]     # these arrive without a sound/vibration
  - type: discord
    enabled: true
    webhook_url: ${DISCORD_WEBHOOK_URL}
    mention: ${DISCORD_MENTION:-}        # e.g. "@everyone" or "<@123456789>"
  - type: ntfy                 # phone push with zero signup: install the ntfy app, subscribe to your topic
    enabled: true
    topic: ${NTFY_TOPIC}
    server: ${NTFY_SERVER:-https://ntfy.sh}
    token: ${NTFY_TOKEN:-}
    priority: high
  - type: slack
    enabled: true
    webhook_url: ${SLACK_WEBHOOK_URL}
  - type: email
    enabled: true
    smtp_host: ${SMTP_HOST:-smtp.gmail.com}
    smtp_port: ${SMTP_PORT:-587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    to_addr: ${NOTIFY_EMAIL}
  - type: webhook
    enabled: true
    url: ${GENERIC_WEBHOOK_URL}

# Community-maintained internship feeds (refreshed many times per day). They cover career sites we do
# not poll directly, and every hardware hit seeds automatic board discovery.
aggregators:
  - kind: listings-json
    name: simplify-summer2027
    url: https://raw.githubusercontent.com/SimplifyJobs/Summer2027-Internships/dev/.github/scripts/listings.json
  - kind: listings-json
    name: vanshb03-summer2027
    url: https://raw.githubusercontent.com/vanshb03/Summer2027-Internships/dev/.github/scripts/listings.json

companies_file: companies.yaml
